name: ci

on:
  push: { branches: [main] }
  pull_request:

permissions: { contents: read }

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix: { python: ["3.10", "3.12"] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests tools report-layer examples/sample-system/adapter.py examples/connector-template
      - run: python -m pytest
      - name: Generated files are up to date
        run: |
          python tools/build_catalog.py && python tools/build_packs.py
          git diff --exit-code -- src/capd/data/catalog examples/packs
      - name: Connector template passes the conformance kit
        run: |
          python -m pip install -e examples/connector-template
          python -m pytest examples/connector-template

  demo:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -e ".[dev]"
      - name: End-to-end demo (main build, then a pull request build with a simulated bug)
        run: examples/sample-system/run-demo.sh
      - name: Report layer on DuckDB
        run: python report-layer/duckdb/build_local.py --evidence "out/demo/*/evidence-rows.ndjson"
      - uses: actions/upload-artifact@v4
        with: { name: demo-output, path: out }

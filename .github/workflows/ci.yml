name: ci

on:
  push: { branches: [main] }
  pull_request:

permissions: { contents: read }

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix: { python: ["3.10", "3.12"] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests tools report-layer examples/sample-system/adapter.py examples/connector-template
      - run: python -m pytest
      - name: Generated files are up to date
        run: |
          python tools/build_catalog.py && python tools/build_packs.py
          git diff --exit-code -- src/capd/data/catalog examples/packs
      - name: Connector template passes the conformance kit
        run: |
          python -m pip install -e examples/connector-template
          python -m pytest examples/connector-template

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t capd .
      - run: docker run --rm capd --version
      - name: The pipeline step runs in the container
        run: |
          mkdir -p out && chmod 777 out
          docker run --rm -v "$PWD:/work" capd collect --junit tests/fixtures/junit.xml --sarif tests/fixtures/security.sarif -o out/bundle.json
          docker run --rm -v "$PWD:/work" capd compare --bundle out/bundle.json -o out/comparison.json --markdown out/summary.md
          docker run --rm -v "$PWD:/work" capd report --bundle out/bundle.json --comparison out/comparison.json -o out/report.html
          docker run --rm -v "$PWD:/work" capd validate sirt examples/sample-package/fna-uat/sirt-response.xlsx
          test -s out/bundle.json && test -s out/report.html

  demo:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -e ".[dev]"
      - name: End-to-end demo (main build, then a pull request build with a simulated bug)
        run: examples/sample-system/run-demo.sh
      - name: Report layer on DuckDB
        run: python report-layer/duckdb/build_local.py --evidence "out/demo/*/evidence-rows.ndjson"
      - name: Snowflake setup script on fakesnow (a local imitation of Snowflake), compared with DuckDB
        run: |
          python -m pip install fakesnow "snowflake-connector-python<4"
          python report-layer/snowflake/setup.py --fake --evidence "out/demo/*/bundle.json" --sample-data --synthetic --compare-duckdb
      - uses: actions/upload-artifact@v4
        with: { name: demo-output, path: out }
